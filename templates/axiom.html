<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOM</title>
<link rel="icon" href="/static/logo.png" type="image/x-icon">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

:root {
  --bg:       #070809;
  --gold:     #c9a96e;
  --gold-dim: rgba(201,169,110,0.15);
  --cream:    #f0eeea;
  --muted:    rgba(240,238,234,0.22);
  --border:   rgba(255,255,255,0.05);
  --mono:     'DM Mono', monospace;
  --serif:    'Cormorant Garamond', serif;
}

/* ── BOTÃO HOME ── */
.btn-home {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  background: none;
  border: none;
  padding: 0;
  color: rgba(240,238,234,0.55);
  font-family: var(--mono);
  font-size: 0.42rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  opacity: 0;
  transition: color 0.5s ease;
}
.btn-home:hover {
  color: rgba(240,238,234,0.9);
}
.btn-home svg {
  width: 8px; height: 8px;
  opacity: 0.75;
  transition: opacity 0.5s ease, transform 0.4s ease;
}
.btn-home:hover svg {
  opacity: 1;
  transform: translateX(-2px);
}

body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--serif);
  display: flex;
  flex-direction: column;
  height: 100vh;
  align-items: center;
  user-select: none;
}

/* ── TOPO ── */
.top-bar {
  width: 100%;
  max-width: 720px;
  padding: 2rem 0 0;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.axiom-name {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 1rem;
  letter-spacing: 0.6em;
  text-transform: uppercase;
  color: rgba(240,238,234,0.4);
}

/* ── VÍDEO ── */
.video-wrap {
  position: relative;
  width: 320px;
  height: 320px;
  flex-shrink: 0;
  margin-top: 0.8rem;
}

.video-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, transparent 35%, var(--bg) 70%);
  z-index: 2;
  pointer-events: none;
}

.video-wrap::after {
  content: '';
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  border: 1px solid rgba(201,169,110,0.07);
  z-index: 3;
  transition: border-color 0.6s ease;
  pointer-events: none;
}

body.speaking .video-wrap::after {
  border-color: rgba(201,169,110,0.25);
  animation: ringBreath 1.4s ease-in-out infinite;
}

body.listening .video-wrap::after {
  border-color: rgba(110,201,169,0.28);
  animation: ringBreath 0.9s ease-in-out infinite;
}

@keyframes ringBreath {
  0%, 100% { transform: scale(1);    opacity: 0.7; }
  50%       { transform: scale(1.03); opacity: 1;   }
}

#robot-face {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  opacity: 0.8;
  transition: filter 0.5s ease, opacity 0.5s ease;
  transform: scale(1.18);
}

body.speaking #robot-face  { filter: brightness(1.12) saturate(1.1); opacity: 0.9; }
body.listening #robot-face { filter: brightness(1.06) saturate(0.9); opacity: 0.85; }

.state-label {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-family: var(--mono);
  font-size: 0.44rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  opacity: 0;
  transition: color 0.4s ease, opacity 0.4s ease;
}

body.speaking  .state-label { color: var(--gold); opacity: 1; }
body.listening .state-label { color: #6ec9a9;     opacity: 1; }

/* ── MENSAGENS ── */
.messages-wrap {
  flex: 1;
  width: 100%;
  max-width: 660px;
  overflow: hidden;
  position: relative;
  margin-top: 0.5rem;
}

.messages-wrap::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: linear-gradient(to bottom, var(--bg), transparent);
  z-index: 2;
  pointer-events: none;
}

.messages {
  height: 100%;
  overflow-y: auto;
  padding: 2rem 1.5rem 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  scrollbar-width: none;
}

.messages::-webkit-scrollbar { display: none; }

.msg {
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
  animation: msgIn 0.45s ease forwards;
  opacity: 0;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-role {
  font-family: var(--mono);
  font-size: 0.44rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}

.msg.axiom .msg-role { color: rgba(201,169,110,0.5); }

.msg-text {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 1rem;
  line-height: 1.75;
  color: rgba(240,238,234,0.7);
}

.msg.axiom .msg-text { color: var(--cream); }

.msg.user .msg-text {
  font-style: italic;
  color: rgba(240,238,234,0.32);
}

/* typing */
.typing-indicator {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 0 1.5rem 0.3rem;
  width: 100%;
  max-width: 660px;
}

.typing-indicator.visible { display: flex; }

.typing-dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--gold);
  animation: typingDot 1.2s ease-in-out infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingDot {
  0%, 60%, 100% { opacity: 0.15; transform: scale(0.8); }
  30%           { opacity: 1;    transform: scale(1.3); }
}

/* wave */
.wave-bars {
  display: none;
  align-items: flex-end;
  gap: 3px;
  height: 13px;
  justify-content: center;
  margin-bottom: 0.2rem;
}

.wave-bars.visible { display: flex; }

.wave-bar {
  width: 2px;
  background: var(--gold);
  border-radius: 1px;
  animation: waveBar 0.7s ease-in-out infinite alternate;
  opacity: 0.55;
}

.wave-bar:nth-child(1) { height: 3px;  animation-delay: 0s; }
.wave-bar:nth-child(2) { height: 8px;  animation-delay: 0.1s; }
.wave-bar:nth-child(3) { height: 12px; animation-delay: 0.05s; }
.wave-bar:nth-child(4) { height: 5px;  animation-delay: 0.15s; }
.wave-bar:nth-child(5) { height: 10px; animation-delay: 0.08s; }
.wave-bar:nth-child(6) { height: 4px;  animation-delay: 0.2s; }
.wave-bar:nth-child(7) { height: 8px;  animation-delay: 0.03s; }

@keyframes waveBar {
  from { transform: scaleY(0.2); opacity: 0.25; }
  to   { transform: scaleY(1);   opacity: 0.65; }
}

/* ── INPUT ── */
.input-section {
  width: 100%;
  max-width: 660px;
  padding: 0.4rem 0 2rem;
  flex-shrink: 0;
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 0;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  background: rgba(255,255,255,0.022);
  padding: 0.55rem 0.55rem 0.55rem 1.3rem;
  transition: border-color 0.3s ease, background 0.3s ease;
}

.input-box:focus-within {
  border-color: rgba(201,169,110,0.18);
  background: rgba(255,255,255,0.03);
}

.text-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--serif);
  font-size: 0.98rem;
  font-weight: 300;
  color: var(--cream);
  resize: none;
  height: 28px;
  max-height: 120px;
  line-height: 1.6;
  padding: 0;
  align-self: center;
}

.text-input::placeholder {
  color: rgba(240,238,234,0.15);
  font-style: italic;
}

.input-actions {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: color 0.2s ease, background 0.2s ease;
}

.btn:hover { color: var(--cream); background: rgba(255,255,255,0.04); }

.btn-send {
  background: var(--gold-dim);
  color: var(--gold);
  border: 1px solid rgba(201,169,110,0.18);
}

.btn-send:hover {
  background: rgba(201,169,110,0.22);
  color: var(--gold);
}

.btn-mic.active {
  color: #6ec9a9;
  background: rgba(110,201,169,0.08);
  animation: micGlow 1.2s ease-in-out infinite;
}

@keyframes micGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(110,201,169,0); }
  50%       { box-shadow: 0 0 0 5px rgba(110,201,169,0.08); }
}

.input-hint {
  text-align: center;
  font-family: var(--mono);
  font-size: 0.43rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(240,238,234,0.08);
  margin-top: 0.65rem;
}

/* ── CONTROLES DE VOZ ── */
.voice-controls {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.5rem 1.3rem 0;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
}

.voice-controls.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: all;
}

.speed-wrap {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex: 1;
}

.speed-label {
  font-family: var(--mono);
  font-size: 0.44rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(240,238,234,0.22);
  white-space: nowrap;
}

.speed-val {
  font-family: var(--mono);
  font-size: 0.44rem;
  letter-spacing: 0.1em;
  color: rgba(201,169,110,0.55);
  min-width: 2.2rem;
  text-align: right;
}

.speed-slider {
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.08);
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}

.speed-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.7;
  cursor: pointer;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.speed-slider::-webkit-slider-thumb:hover { opacity: 1; transform: scale(1.2); }

.speed-slider::-moz-range-thumb {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.7;
  border: none;
  cursor: pointer;
}

.btn-pause {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.07);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(240,238,234,0.3);
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  flex-shrink: 0;
}

.btn-pause:hover { color: var(--cream); border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); }

.btn-pause.paused {
  color: var(--gold);
  border-color: rgba(201,169,110,0.25);
  background: var(--gold-dim);
}

.intro {
  opacity: 0;
  animation: msgIn 0.9s ease 0.7s forwards;
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="btn-home" id="btnHome">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Home
  </a>
  <div class="axiom-name">Axiom</div>
</div>

<div class="video-wrap">
  <!-- video A: escuta (ativo por padrão) -->
  <video id="vid-escuta" autoplay muted loop playsinline webkit-playsinline preload="auto"
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity 0.4s ease;">
    <source src="/static/videos/robo-escuta.mp4" type="video/mp4">
  </video>
  <!-- video B: fala (pré-carregado, invisível) -->
  <video id="vid-fala" muted loop playsinline webkit-playsinline preload="auto"
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.4s ease;">
    <source src="/static/videos/robo-fala.webm" type="video/mp4">
  </video>
  <span class="state-label" id="state-label">Pronto</span>
</div>

<div class="messages-wrap">
  <div class="messages" id="messages">
    <div class="msg axiom intro">
      <span class="msg-role">Axiom</span>
      <span class="msg-text">Olá. Estou aqui. Pode falar comigo ou digitar — da forma que preferir.</span>
    </div>
  </div>
</div>

<div class="typing-indicator" id="typingIndicator">
  <div class="typing-dot"></div>
  <div class="typing-dot"></div>
  <div class="typing-dot"></div>
</div>

<div class="wave-bars" id="waveBars">
  <div class="wave-bar"></div>
  <div class="wave-bar"></div>
  <div class="wave-bar"></div>
  <div class="wave-bar"></div>
  <div class="wave-bar"></div>
  <div class="wave-bar"></div>
  <div class="wave-bar"></div>
</div>

<div class="input-section">
  <div class="voice-controls" id="voiceControls">
    <div class="speed-wrap">
      <span class="speed-label">Velocidade</span>
      <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="2" step="0.1" value="0.92">
      <span class="speed-val" id="speedVal">0.9×</span>
    </div>
    <button class="btn-pause" id="pauseBtn" title="Pausar">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" id="pauseIcon">
        <rect x="6" y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
    </button>
  </div>
  <div class="input-box">
    <textarea class="text-input" id="textInput" placeholder="Fale com Axiom…" rows="1"></textarea>
    <div class="input-actions">
      <button class="btn btn-mic" id="micBtn" title="Falar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
      <button class="btn btn-send" id="sendBtn" title="Enviar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="input-hint">Enter para enviar · Shift+Enter nova linha</div>
</div>

<script>
let isListening  = false;
let isSpeaking   = false;
let isPaused     = false;
let recognition  = null;
let currentUtter = null;
let speechRate   = 0.92;
const history    = [];

const messagesEl    = document.getElementById('messages');
const textInput     = document.getElementById('textInput');
const micBtn        = document.getElementById('micBtn');
const sendBtn       = document.getElementById('sendBtn');
const typingEl      = document.getElementById('typingIndicator');
const waveEl        = document.getElementById('waveBars');
const stateLabel    = document.getElementById('state-label');
const voiceControls = document.getElementById('voiceControls');
const speedSlider   = document.getElementById('speedSlider');
const speedVal      = document.getElementById('speedVal');
const pauseBtn      = document.getElementById('pauseBtn');
const pauseIcon     = document.getElementById('pauseIcon');

const ICON_PAUSE = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
const ICON_PLAY  = '<polygon points="5,3 19,12 5,21"/>';

// ── dois vídeos sobrepostos com crossfade — sem .load() durante a troca ──
// Chamar .load() no iOS descarta o frame atual e deixa tela preta.
// Solução: dois <video> sempre carregados; alternar opacidade entre eles.
var vidEscuta = document.getElementById('vid-escuta');
var vidFala   = document.getElementById('vid-fala');
var currentVideo = 'escuta'; // rastreia qual está ativo

// Referência legada usada em outras partes do código
var robotVideo = vidEscuta;

function playVid(v) {
  v.muted = true;
  var p = v.play();
  if (p && p.catch) p.catch(function(){});
}

function setVideo(srcMp4) {
  var isFala = srcMp4.indexOf('robo-fala') !== -1;

  if (isFala && currentVideo !== 'fala') {
    currentVideo = 'fala';
    playVid(vidFala);
    vidFala.style.opacity   = '1';
    vidEscuta.style.opacity = '0';
    setTimeout(function() { vidEscuta.pause(); }, 450);
  } else if (!isFala && currentVideo !== 'escuta') {
    currentVideo = 'escuta';
    playVid(vidEscuta);
    vidEscuta.style.opacity = '1';
    vidFala.style.opacity   = '0';
    setTimeout(function() { vidFala.pause(); }, 450);
  }
}

// Pré-inicia os dois vídeos no primeiro toque (desbloqueio iOS)
document.addEventListener('touchstart', function onFirstTouch() {
  playVid(vidEscuta);
  playVid(vidFala);
  vidFala.pause(); // mantém fala pausado até ser chamado
  document.removeEventListener('touchstart', onFirstTouch);
}, { once: true });

// Desktop: inicia escuta logo
playVid(vidEscuta);

speedSlider.addEventListener('input', () => {
  speechRate = parseFloat(speedSlider.value);
  speedVal.textContent = speechRate.toFixed(1) + '\u00d7';
});

pauseBtn.addEventListener('click', () => {
  if (!isSpeaking) return;
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    pauseBtn.classList.remove('paused');
    pauseBtn.title = 'Pausar';
    pauseIcon.innerHTML = ICON_PAUSE;
    setState('speaking');
    setWave(true);
    setVideo('/static/videos/robo-fala.webm');
  } else {
    window.speechSynthesis.pause();
    isPaused = true;
    pauseBtn.classList.add('paused');
    pauseBtn.title = 'Retomar';
    pauseIcon.innerHTML = ICON_PLAY;
    setState('idle');
    setWave(false);
    setVideo('/static/videos/robo-escuta.mp4');
  }
});

function setState(state) {
  document.body.classList.remove('listening', 'speaking');
  if (state === 'listening') {
    document.body.classList.add('listening');
    stateLabel.textContent = 'Ouvindo';
  } else if (state === 'speaking') {
    document.body.classList.add('speaking');
    stateLabel.textContent = 'Falando';
  } else {
    stateLabel.textContent = 'Pronto';
  }
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <span class="msg-role">${role === 'user' ? 'Você' : 'Axiom'}</span>
    <span class="msg-text">${text}</span>
  `;
  messagesEl.appendChild(div);
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  return div;
}

function setTyping(on) {
  typingEl.classList.toggle('visible', on);
  if (on) messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

function setWave(on) {
  waveEl.classList.toggle('visible', on);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  isPaused = false;
  pauseBtn.classList.remove('paused');
  pauseIcon.innerHTML = ICON_PAUSE;

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang  = 'pt-BR';
  utter.rate  = speechRate;
  utter.pitch = 0.95;

  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.startsWith('pt') && v.name.toLowerCase().includes('fem'))
                || voices.find(v => v.lang.startsWith('pt'))
                || voices[0];
  if (ptVoice) utter.voice = ptVoice;

  utter.onend = utter.onerror = () => {
    setState('idle');
    setWave(false);
    isSpeaking = false;
    isPaused = false;
    voiceControls.classList.remove('visible');
    setVideo('/static/videos/robo-escuta.mp4');
  };

  setVideo('/static/videos/robo-fala.webm');
  setState('speaking');
  setWave(true);
  voiceControls.classList.add('visible');
  isSpeaking = true;
  currentUtter = utter;
  window.speechSynthesis.speak(utter);
}

window.speechSynthesis?.getVoices();
window.speechSynthesis?.addEventListener?.('voiceschanged', () => window.speechSynthesis.getVoices());

async function askAxiom(userText) {
  history.push({ role: 'user', content: userText });
  setTyping(true);
  setState('idle');

  try {
    const res = await fetch('/api/axiom', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensagem: userText, historico: history })
    });

    const data = await res.json();
    const reply = data.resposta || 'Não consegui processar sua mensagem.';

    setTyping(false);
    addMessage('axiom', reply);
    history.push({ role: 'assistant', content: reply });
    speak(reply);

  } catch (err) {
    console.error(err);
    setTyping(false);
    addMessage('axiom', 'Ocorreu um erro na conexão. Tente novamente.');
    setState('idle');
  }
}

function handleSend() {
  const text = textInput.value.trim();
  if (!text || isSpeaking) return;
  window.speechSynthesis?.cancel();
  addMessage('user', text);
  textInput.value = '';
  textInput.style.height = '28px';
  askAxiom(text);
}

sendBtn.addEventListener('click', handleSend);

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

textInput.addEventListener('input', () => {
  textInput.style.height = '28px';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('active');
    setState('listening');
  };

  recognition.onresult = e => {
    const transcript = e.results[0][0].transcript.trim();
    if (transcript) {
      addMessage('user', transcript);
      askAxiom(transcript);
    }
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('active');
    if (!isSpeaking) setState('idle');
  };

  recognition.onerror = () => {
    isListening = false;
    micBtn.classList.remove('active');
    setState('idle');
  };

  micBtn.addEventListener('click', () => {
    if (isSpeaking) { window.speechSynthesis.cancel(); return; }
    isListening ? recognition.stop() : recognition.start();
  });

} else {
  micBtn.style.opacity = '0.3';
  micBtn.title = 'Microfone não suportado';
  micBtn.disabled = true;
}

setState('idle');

// ── GSAP entrada btn-home ──
gsap.fromTo('#btnHome',
  { opacity: 0, x: -10 },
  { opacity: 1, x: 0, duration: 1.1, ease: 'power3.out', delay: 0.6 }
);
</script>
